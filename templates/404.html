{% extends 'layout.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2 text-center">
        <div class="card shadow">
            <div class="card-header bg-danger bg-gradient text-white">
                <h2 class="mb-0">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    404 - Page Not Found
                </h2>
            </div>
            <div class="card-body">
                <div class="py-5">
                    <i class="fas fa-search fa-4x text-muted mb-4"></i>
                    <h3 class="mb-4">Oops! We couldn't find that page.</h3>
                    <p class="lead">The page you were looking for doesn't exist or might have been moved.</p>
                    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg mt-4">
                        <i class="fas fa-home me-2"></i>
                        Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
